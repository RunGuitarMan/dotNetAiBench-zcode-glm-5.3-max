    post:
      tags: [Economic]
      summary: 'Ручное начисление (владелец/Admin; интеграция — grant Award: кампания+ресурс)'
      description: 'Повтор номера: существенные данные — campaignId (из URL), masterId, resourceId, amount, reason; те же — исходный статус и сохранённое представление (бессрочно); иные — 409; авторизация первой. H0 Q01 (AMB-04 закрыт): новое ручное начисление допустимо активному сотруднику текущей аудитории действующей опубликованной кампании; предыдущее выполнение/прогресс не требуется.'
      parameters:
        - $ref: '#/components/parameters/uuidId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ManualAwardCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: result=Posted или Declined (InsufficientBudget/ResourceUnavailable/RecipientNotActive/RecipientNotInAudience)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
  /reversals:
    post:
      tags: [Economic]
      summary: Полная отмена (Admin; текущий владелец кампании-источника — начисления; система покупок — свои траты при grant Spend)
      description: 'Повтор номера: существенные данные — originalOperationId, reason; те же — исходный статус и сохранённое представление (бессрочно); иные — 409; авторизация первой. Отказы — экономические (201 Declined): InsufficientBalance, OriginalAlreadyReversed, OriginalNotPosted. H0 Q03 (AMB-02/03 закрыты): корректирующая отмена при заблокированном получателе разрешена только Admin (B26–B27); владелец без Admin и service получают 403 без записи, в том числе перед replay.'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReversalCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: result=Posted или Declined
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}

  /me/wallet:
    get:
      tags: [Wallets]
      summary: Свои балансы по ресурсам (из PostgreSQL, не из кеша)
      responses:
        '200':
          description: Балансы и статусы ресурсов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wallet'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/operations:
    get:
      tags: [Operations]
      summary: Своя история операций (user — кошелька; service — разрешённой системы покупок)
      description: |
        Для сотрудника — только операции его кошелька, включая отклонённые (B22.3).
        Для service область — проверенная компания и действующие grants Spend его JWT subject
        на конкретные пары (purchaseSystemId, resourceId): каждая пара соответствует одному
        реально выданному grant, независимое объединение систем и ресурсов запрещено.
        Доступны относящиеся к этим парам Spend и SpendReversal, включая сохранённые
        Posted/Declined, независимо от инициатора (сотрудник, service или Admin).
        Для SpendReversal принадлежность определяется исходной тратой через существующий
        originalOperationId, её purchaseSystemId и resourceId в items; настоящий initiator сохраняется
        в DTO. Начисления, остальные операции кошелька, другая компания/система и ресурс вне
        grants недоступны. Текущие права проверяются при каждом чтении, включая страницы
        со старым cursor; cursor не сохраняет отозванное право. Неверный токен — 401,
        недостаточные полномочия/отсутствие действующего grant — 403 (B04/B05/B23/B27, T04).
        Повторы защищены номерами операций (бессрочно, сохранённый исходный ответ).
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: resourceId
          in: query
          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/OperationKind'}
        - name: result
          in: query
          schema: {type: string, enum: [Posted, Declined]}
      responses:
        '200':
          description: Порядок createdAt, id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Operation'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /me/achievements:
    get:
      tags: [Wallets]
      summary: Свои достижения по сезонам
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: season
          in: query
          schema: {type: integer, format: int32}
      responses:
        '200':
          description: Порядок season, grantedAt
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AchievementGrant'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/progress-events:
    get:
      tags: [Progress]
      summary: Собственная история выполнения (сотрудник из проверенного токена)
      description: |
        Прошлые периоды и сезоны, включая частичный прогресс, завершения и решения о награде
        с причинами отказов. Доступ сохраняется после потери аудитории (B11.6) и архива
        кампании. Историей не подменяет текущее состояние (/me/campaigns/{id}/progress).
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: campaignId
          in: query
          schema: {type: string, format: uuid}
        - name: taskId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: 'Порядок acceptedAt, id; keyset-курсор append-only истории'
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProgressEventResult'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /me/campaigns/{id}/progress:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Progress]
      summary: Свой прогресс по кампании (задания, периоды, очки, вехи)
      responses:
        '200':
          description: Прогресс текущих периодов и очки стримов
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CampaignProgress'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /employees/{masterId}/wallet:
    parameters:
      - $ref: '#/components/parameters/masterId'
    get:
      tags: [Wallets]
      summary: Кошелёк сотрудника (Admin)
      responses:
        '200':
          description: Балансы
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Wallet'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /employees/{masterId}/operations:
    parameters:
      - $ref: '#/components/parameters/masterId'
    get:
      tags: [Operations]
      summary: История операций сотрудника (Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: resourceId
          in: query
          schema: {type: string, format: uuid}
        - name: kind
          in: query
          schema: {$ref: '#/components/schemas/OperationKind'}
      responses:
        '200':
          description: Порядок createdAt, id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Operation'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /operations/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Operations]
      summary: Операция (инициатор, задействованный сотрудник, Admin, своя система покупок)
      description: |
        Сотрудник читает только собственный кошелёк; права остальных user-ролей сохраняются.
        Для service совпадение initiator с JWT subject не определяет доступ: в проверенной
        компании доступны только Spend и SpendReversal по действующему grant Spend этого
        subject на конкретную пару (purchaseSystemId, resourceId), как в GET /me/operations.
        Пары систем и ресурсов не комбинируются между grants. Включены сохранённые
        Posted/Declined независимо от настоящего initiator (сотрудник, service или Admin);
        initiator в DTO не меняется. Возврат относится к системе/ресурсу исходной траты
        через существующий originalOperationId. Начисления и прочая история кошелька, другая
        компания/система и ресурс вне grants недоступны. Текущие права проверяются при
        каждом чтении; известный operationId не обходит отзыв grant. Неверный токен — 401,
        недостаточные полномочия — 403; чужой/недоступный персональный объект — 404 (T04).
      responses:
        '200':
          description: Полное представление операции
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /campaigns/{id}/operations:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Operations]
      summary: Расходы кампании — начисления и их отмены (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: resourceId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Порядок createdAt, id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Operation'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /challenges/{id}/leaderboard:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Leaderboards]
      summary: 'Рейтинг соревнования (top N; текущая аудитория — до конца сезона, после сезона — участники/владелец/Admin)'
      description: |
        Соревновательное ранжирование: 100, 100, 90 → места 1, 1, 3; равные строки — по
        возрастанию masterId. Состав данных — только masterId, счёт, место (B32.4).
        Граница доступа — «после сезона» (B32.5), а не «после финала»: Final — состояние
        результата, не основание досрочно менять права чтения; собственное историческое
        участие проверяется по сохранённым challenge_results. H0 Q04: до конца сезона
        текущая аудитория читает и после конца/архива кампании; потерявший аудиторию не читает.
        После сезона сотруднику нужна собственная историческая строка именно этого челленджа,
        включая счёт 0; права владельца/Admin сохраняются по B32.
        state=Live — актуальный счёт, now − asOfUtc ≤ 5 с; Final — неизменяемые итоги,
        asOfUtc = момент финализации. Live-рейтинг — top N (limit), cursor-обход всей
        коллекции не обещается (T04).
      parameters:
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: Top N рейтинга
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaderboardPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /challenges/{id}/leaderboard/me:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Leaderboards]
      summary: Собственное место
      description: 'H0 Q04: правила доступа те же, что для GET /challenges/{id}/leaderboard; после сезона сотруднику требуется собственная историческая строка именно этого челленджа, включая счёт 0.'
      responses:
        '200':
          description: Место и счёт вызывающего
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LeaderboardMe'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}

  /audit-records:
    get:
      tags: [Audit]
      summary: Журнал изменений прав/настроек/бюджета (Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - $ref: '#/components/parameters/from'
        - $ref: '#/components/parameters/to'
        - name: entityType
          in: query
          schema: {type: string}
        - name: entityId
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Порядок createdAt, id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/AuditRecord'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /exports:
    post:
      tags: [Exports]
      summary: Заказать выписку (сотрудник — своя; Admin — сотрудник/компания)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создан заказ (status=Pending); данные фиксируются при первом успешном начале формирования
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
    get:
      tags: [Exports]
      summary: Свои заказы выписок (Admin — по компании)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Порядок createdAt, id
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Export'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /exports/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Exports]
      summary: Состояние выписки (только заказчик с действующими правами)
      responses:
        '200':
          description: Текущий статус и метаданные
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Export'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Exports]
      summary: Удалить выписку (заказчик); без If-Match
      responses:
        '204': {description: 'Удалена; новые ссылки не выдаются, история запроса остаётся'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /exports/{id}/download-links:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    post:
      tags: [Exports]
      summary: Выдать ссылку на скачивание (≤60 с)
      description: 'Повтор ключа возвращает ту же, возможно истёкшую ссылку; удалённая выписка — 409 после проверки доступа; новая ссылка — новый ключ.'
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Ссылка на неизменяемые проверенные байты
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DownloadLink'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: Выписка не Ready или удалена (после проверки доступа)
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
        '424':
          description: S3 временно недоступен; повтор позже
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    limit:
      name: limit
      in: query
      description: Размер страницы, 1..100, по умолчанию 50
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    cursor:
      name: cursor
      in: query
      description: Непрозрачный keyset-курсор
      schema: {type: string}
    from:
      name: from
      in: query
      description: Начало интервала включительно (с UTC offset)
      schema: {type: string, format: date-time}
    to:
      name: to
      in: query
      description: Конец интервала исключительно (с UTC offset)
      schema: {type: string, format: date-time}
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag из GET объекта; отсутствие — 428, устаревание — 412
      schema: {type: string}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Scope: company + инициатор + операция/цель + ключ; хранение ≥ 24 ч'
      schema: {type: string, minLength: 1, maxLength: 128}
    masterId:
      name: masterId
      in: path
      required: true
      schema: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
    uuidId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Неверные поля/форматы/пределы/сочетание цели grant (validation.*)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Неверный/просроченный токен (auth.invalid-token)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Недостаточно полномочий (authz.forbidden / authz.grant-missing / authz.employee-not-active)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Объект не найден или чужой (not-found)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Конфликт номера/данных идемпотентности/состояния (conflict.*)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: Отсутствует If-Match (precondition.required)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: Устаревший If-Match (precondition.failed)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: PostgreSQL недоступен; ограниченный по времени отказ
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Cursor:
      type: string
      description: Присутствует только при наличии следующей страницы
    Problem:
      type: object
      description: RFC 9457 + постоянный machine-readable code
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
