          type: array
          items: {$ref: '#/components/schemas/LeaderboardEntry'}
        state: {type: string, enum: [Live, Final]}
        asOfUtc: {type: string, format: date-time}
    LeaderboardMe:
      type: object
      description: 'При отсутствии участия: participating=false, score=null, place=null — без выдуманного нулевого участника или места'
      required: [masterId, participating, state, asOfUtc]
      properties:
        masterId: {type: integer, format: int32, minimum: 1, maximum: 2147483647} # H0 Q07: положительный Int32
        participating: {type: boolean}
        score: {type: integer, format: int64, minimum: 0, nullable: true}
        place: {type: integer, format: int32, minimum: 1, nullable: true}
        state: {type: string, enum: [Live, Final]}
        asOfUtc: {type: string, format: date-time}
    IntegrationGrant:
      type: object
      required: [id, subject, kind, status, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        kind: {type: string, enum: [Progress, Award, Spend]}
        campaignId: {type: string, format: uuid, nullable: true}
        resourceId: {type: string, format: uuid, nullable: true}
        purchaseSystemId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [Active, Revoked]}
        createdAtUtc: {type: string, format: date-time}
        revokedAtUtc: {type: string, format: date-time, nullable: true}
    IntegrationGrantCreate:
      type: object
      description: |
        Строгие сочетания цели (B04): Progress → campaignId; Award → campaignId + resourceId;
        Spend → resourceId + purchaseSystemId. Иные поля запрещены; нарушение — 400 validation.grant-target.
      oneOf:
        - type: object
          additionalProperties: false
          required: [subject, kind, campaignId]
          properties:
            subject: {type: string, minLength: 1, maxLength: 100}
            kind: {type: string, enum: [Progress]}
            campaignId: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [subject, kind, campaignId, resourceId]
          properties:
            subject: {type: string, minLength: 1, maxLength: 100}
            kind: {type: string, enum: [Award]}
            campaignId: {type: string, format: uuid}
            resourceId: {type: string, format: uuid}
        - type: object
          additionalProperties: false
          required: [subject, kind, resourceId, purchaseSystemId]
          properties:
            subject: {type: string, minLength: 1, maxLength: 100}
            kind: {type: string, enum: [Spend]}
            resourceId: {type: string, format: uuid}
            purchaseSystemId: {type: string, format: uuid}
    PurchaseSystem:
      type: object
      required: [id, code, name, status, acceptedResourceIds]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Active, Archived]}
        acceptedResourceIds:
          type: array
          items: {type: string, format: uuid}
    PurchaseSystemCreate:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^ *[A-Za-z0-9_-]{1,40} *$', description: 'H0 Q07: крайние обычные пробелы удаляются; затем алфавит/длина T05, непустое значение и сравнение без регистра; внутренние символы значимы'}
        name: {type: string, minLength: 1, maxLength: 200}
        acceptedResourceIds:
          type: array
          items: {type: string, format: uuid}
    PurchaseSystemPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Active, Archived]}
        acceptedResourceIds:
          type: array
          items: {type: string, format: uuid}
    ExportCreate:
      type: object
      description: 'H0 Q05: диапазон [fromUtc, toUtc), fromUtc строго раньше toUtc; отбор по времени движения не заменяет фиксированный снимок B36.'
      required: [scope, fromUtc, toUtc]
      properties:
        scope: {type: string, enum: [Own, Employee, Company]}
        masterId:
          type: integer
          format: int32
          maximum: 2147483647 # H0 Q07
          minimum: 1 # H0 Q07
          nullable: true
          description: Обязателен при scope=Employee (Admin)
        resourceId:
          type: string
          format: uuid
          nullable: true
          description: null — все ресурсы
        fromUtc: {type: string, format: date-time}
        toUtc: {type: string, format: date-time, description: 'Диапазон [from, to)'}
    Export:
      type: object
      required: [id, scope, fromUtc, toUtc, status, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        scope: {type: string, enum: [Own, Employee, Company]}
        masterId: {type: integer, format: int32, nullable: true, minimum: 1, maximum: 2147483647} # H0 Q07: положительный Int32
        resourceCode: {type: string, nullable: true}
        fromUtc: {type: string, format: date-time}
        toUtc: {type: string, format: date-time}
        status: {type: string, enum: [Pending, Forming, Ready, Error, Deleted]}
        createdAtUtc: {type: string, format: date-time}
        dataFrozenAtUtc: {type: string, format: date-time, nullable: true}
        readyAtUtc: {type: string, format: date-time, nullable: true}
        sizeBytes: {type: integer, format: int64, nullable: true}
        checksum: {type: string, nullable: true}
        errorDetail: {type: string, nullable: true}
    DownloadLink:
      type: object
      required: [id, url, expiresAtUtc]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: 'Приватный S3, срок ≤ 60 с'}
        expiresAtUtc: {type: string, format: date-time}
    AuditRecord:
      type: object
      required: [id, actor, action, entityType, entityId, atUtc]
      properties:
        id: {type: string, format: uuid}
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string}
        entityType: {type: string}
        entityId: {type: string}
        changes:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field: {type: string}
              from: {type: string, nullable: true}
              to: {type: string, nullable: true}
        atUtc: {type: string, format: date-time}
