      description: |
        Номер события уникален в компании+источнике бессрочно. Повтор с теми же данными
        возвращает сохранённый результат без новых последствий; расхождение сотрудник/задание/
        увеличение — 409. Бизнес-отказ (неактивен, не в аудитории, вне сроков, архив)
        сохраняется как result=Rejected (по умолчанию занимает номер, AMB-08). Неверные данные — 400 без записи.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgressEventCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Обработано (Accepted или Rejected); creditedDelta может быть 0
          content:
