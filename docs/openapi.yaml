openapi: 3.0.3
info:
  title: Motiva API
  version: 1.0.0
  description: |
    Мотивационные кампании Motiva, этап 2 (контракт, реализация отсутствует).
    Соглашения: экономический отказ корректно сформированной операции — 201 с result=Declined
    (то же представление, что Posted); доступ/валидация — 4xx без создания ресурса операции.
    Бизнес-номера (progress events, операции B24) бессрочны и не требуют Idempotency-Key;
    остальные создающие POST требуют заголовок Idempotency-Key. Изменяемые настройки
    защищены strong ETag + If-Match. Списки: items + nextCursor, limit 1..100 (default 50).
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный стенд
security:
  - bearerAuth: []
tags:
  - {name: Employees}
  - {name: Resources}
  - {name: Achievements}
  - {name: Campaigns}
  - {name: Budgets}
  - {name: IntegrationGrants}
  - {name: PurchaseSystems}
  - {name: Progress}
  - {name: Wallets}
  - {name: Operations}
  - {name: Economic}
  - {name: Leaderboards}
  - {name: Audit}
  - {name: Exports}

paths:
  /employees:
    get:
      tags: [Employees]
      summary: Список сотрудников компании (Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Устойчивый порядок по masterId по возрастанию
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Employee'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Employees]
      summary: Создать профиль сотрудника с кошельком (Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeeCreate'}
      responses:
        '201':
          description: Создан профиль и ровно один кошелёк одной транзакцией
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /employees/{masterId}:
    parameters:
      - $ref: '#/components/parameters/masterId'
    get:
      tags: [Employees]
      summary: Профиль (Admin или сам сотрудник)
      responses:
        '200':
          description: Профиль с strong ETag
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Employees]
      summary: Изменить активность/теги (Admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeePatch'}
      responses:
        '200':
          description: Обновлённый профиль
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /resources:
    get:
      tags: [Resources]
      summary: Каталог ресурсов компании
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: status
          in: query
          schema: {type: string, enum: [Active, Archived]}
      responses:
        '200':
          description: Порядок по коду; кешируется (asOf в заголовке Date)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Resource'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Resources]
      summary: Создать ресурс (Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCreate'}
      responses:
        '201':
          description: Создан; балансы равны нулю; код неизменяем
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /resources/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Resources]
      summary: Ресурс
      responses:
        '200':
          description: С strong ETag
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Resources]
      summary: Переименовать или архивировать (Admin); архив необратим
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourcePatch'}
      responses:
        '200':
          description: Обновлённый ресурс
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /achievements:
    get:
      tags: [Achievements]
      summary: Определения достижений
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Порядок по коду
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Achievement'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Achievements]
      summary: Создать определение достижения (Admin); архивирование не предусмотрено источником
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AchievementCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Achievement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /achievements/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Achievements]
      summary: Достижение
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Achievement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Achievements]
      summary: Изменить название/описание (Admin); код неизменяем
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AchievementPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Achievement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /campaigns:
    get:
      tags: [Campaigns]
      summary: Кампании (сотрудник — опубликованные текущего сезона; владелец/Admin — расширенно)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: season
          in: query
          schema: {type: integer, format: int32}
        - name: status
          in: query
          schema: {type: string, enum: [Draft, Published, Archived]}
      responses:
        '200':
          description: Порядок по коду
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Campaign'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Campaigns]
      summary: Создать черновик кампании (Admin назначает владельца)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Черновик виден только владельцу и Admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /campaigns/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Кампания
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Campaigns]
      summary: Настроить или перевести в Published/Archived (владелец/Admin)
      description: |
        После публикации изменяемы name/description/audience/ownerMasterId и архивация;
        сезон, сроки, состав заданий, цели, периодичность, награды, очки, правила рейтинга — 409.
        status=Published запускает проверку состава (B09.4); провал — 409 conflict.publish-check.
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    delete:
      tags: [Campaigns]
      summary: Удалить черновик целиком (владелец/Admin); не-черновик — 409
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Удалено с дочерними настройками}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /campaigns/{id}/streams:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Стримы кампании
      responses:
        '200':
          description: Порядок по коду
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Stream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Campaigns]
      summary: Создать стрим (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /streams/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Стрим
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Campaigns]
      summary: Переименовать или архивировать (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /streams/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Задания стрима
      responses:
        '200':
          description: Порядок по коду
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Campaigns]
      summary: Создать задание (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /tasks/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Задание
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Campaigns]
      summary: Настроить задание (до публикации) или архивировать
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaskPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Task'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /streams/{id}/milestones:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Вехи стрима
      responses:
        '200':
          description: Порядок по порогу
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Milestone'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Campaigns]
      summary: Создать веху (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MilestoneCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создана
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Milestone'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /milestones/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    delete:
      tags: [Campaigns]
      summary: Удалить веху (только черновик, иначе 409; владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Удалена}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /campaigns/{id}/challenges:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Челленджи кампании
      responses:
        '200':
          description: Порядок по startsAt
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Challenge'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Campaigns]
      summary: Задать челлендж по одному стриму (только до публикации, иначе 409)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChallengeCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Challenge'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /challenges/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Челлендж
      responses:
        '200':
          description: Данные соревнования
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Challenge'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Campaigns]
      summary: Удалить челлендж (только черновик, иначе 409; владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Удалён}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
