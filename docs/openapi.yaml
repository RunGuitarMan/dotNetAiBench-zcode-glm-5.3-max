              schema: {$ref: '#/components/schemas/Problem'}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    limit:
      name: limit
      in: query
      description: Размер страницы, 1..100, по умолчанию 50
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    cursor:
      name: cursor
      in: query
      description: Непрозрачный keyset-курсор
      schema: {type: string}
    from:
      name: from
      in: query
      description: Начало интервала включительно (с UTC offset)
      schema: {type: string, format: date-time}
    to:
      name: to
      in: query
      description: Конец интервала исключительно (с UTC offset)
      schema: {type: string, format: date-time}
    ifMatch:
      name: If-Match
      in: header
      required: true
      description: Strong ETag из GET; отсутствие — 428, устаревание — 412
      schema: {type: string}
    idempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 'Scope: company + инициатор + операция/цель + ключ; хранение ≥ 24 ч'
      schema: {type: string, minLength: 1, maxLength: 128}
    masterId:
      name: masterId
      in: path
      required: true
      schema: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
    uuidId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Неверные поля/форматы/пределы (validation.*)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Unauthorized:
      description: Неверный/просроченный токен (auth.invalid-token)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Недостаточно полномочий (authz.forbidden / authz.grant-missing)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Объект не найден или чужой (not-found)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Конфликт номера/данных идемпотентности/состояния (conflict.*)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionRequired:
      description: Отсутствует If-Match (precondition.required)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    PreconditionFailed:
      description: Устаревший If-Match (precondition.failed)
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ServiceUnavailable:
      description: PostgreSQL недоступен; ограниченный по времени отказ
      headers:
        Retry-After: {schema: {type: integer}}
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
  schemas:
    Cursor:
      type: string
      description: Присутствует только при наличии следующей страницы
    Problem:
      type: object
      description: RFC 9457 + постоянный machine-readable code
      required: [type, title, status, code, traceId]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        code:
          type: string
          enum: [validation.failed, validation.overflow, validation.code-format,
                 auth.invalid-token, authz.forbidden, authz.grant-missing, not-found,
                 conflict.business-number, conflict.idempotency-data, conflict.state,
                 conflict.publish-check, precondition.required, precondition.failed,
                 service.unavailable, dependency.unavailable]
        detail: {type: string}
        traceId: {type: string}
        errors:
          type: array
          items:
            type: object
            properties:
              field: {type: string}
              message: {type: string}
    Actor:
      type: object
      description: Инициатор из проверенного токена
      required: [actorType]
      properties:
        actorType: {type: string, enum: [user, service]}
        masterId: {type: integer, format: int32, nullable: true}
        subject: {type: string, nullable: true}
    Employee:
      type: object
      required: [masterId, isActive, tags, createdAtUtc]
      properties:
        masterId: {type: integer, format: int32}
        isActive: {type: boolean}
        tags:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        createdAtUtc: {type: string, format: date-time}
    EmployeeCreate:
      type: object
      required: [masterId]
      properties:
        masterId: {type: integer, format: int32, minimum: 1, maximum: 2147483647}
        tags:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
    EmployeePatch:
      type: object
      minProperties: 1
      properties:
        isActive: {type: boolean}
        tags:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
    Resource:
      type: object
      required: [id, code, name, status, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Active, Archived]}
        createdAtUtc: {type: string, format: date-time}
    ResourceCreate:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
    ResourcePatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        status:
          type: string
          enum: [Archived]
          description: Архивирование необратимо
    Achievement:
      type: object
      required: [id, code, name]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000, nullable: true}
    AchievementCreate:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
    AchievementPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
    Audience:
      type: object
      description: 'Пустой набор не ограничивает; none — запрещающие теги'
      properties:
        any:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        all:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
        none:
          type: array
          items: {type: string, pattern: '^[a-z0-9-]{1,32}$'}
    Campaign:
      type: object
      required: [id, code, name, season, ownerMasterId, startsAt, endsAt, status, audience, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000, nullable: true}
        season: {type: integer, format: int32}
        ownerMasterId: {type: integer, format: int32}
        startsAt: {type: string, format: date-time, description: 'С UTC offset на входе'}
        endsAt: {type: string, format: date-time}
        status: {type: string, enum: [Draft, Published, Archived]}
        audience: {$ref: '#/components/schemas/Audience'}
        createdAtUtc: {type: string, format: date-time}
        publishedAtUtc: {type: string, format: date-time, nullable: true}
    CampaignCreate:
      type: object
      required: [code, name, ownerMasterId, startsAt, endsAt]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        ownerMasterId: {type: integer, format: int32, minimum: 1}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        audience: {$ref: '#/components/schemas/Audience'}
    CampaignPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        ownerMasterId: {type: integer, format: int32, minimum: 1}
        audience: {$ref: '#/components/schemas/Audience'}
        status:
          type: string
          enum: [Published, Archived]
          description: 'Published — с проверкой состава; оба перехода не отменяются'
    Stream:
      type: object
      required: [id, campaignId, code, name, status]
      properties:
        id: {type: string, format: uuid}
        campaignId: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Active, Archived]}
    StreamCreate:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
    StreamPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Archived]}
    RewardItem:
      type: object
      required: [resourceId, amount]
      properties:
        resourceId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
    Task:
      type: object
      required: [id, streamId, code, name, goal, period, streamPoints, rewardItems, status]
      properties:
        id: {type: string, format: uuid}
        streamId: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000, nullable: true}
        goal: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        period: {type: string, enum: [Day, Month, Quarter, HalfYear, Year]}
        streamPoints: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        rewardItems:
          type: array
          items: {$ref: '#/components/schemas/RewardItem'}
        status: {type: string, enum: [Active, Archived]}
    TaskCreate:
      type: object
      required: [code, name, goal, period, streamPoints, rewardItems]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        goal: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        period: {type: string, enum: [Day, Month, Quarter, HalfYear, Year]}
        streamPoints: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        rewardItems:
          type: array
          items: {$ref: '#/components/schemas/RewardItem'}
    TaskPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        goal: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        period: {type: string, enum: [Day, Month, Quarter, HalfYear, Year]}
        streamPoints: {type: integer, format: int64, minimum: 0, maximum: 1000000000}
        rewardItems:
          type: array
          items: {$ref: '#/components/schemas/RewardItem'}
        status: {type: string, enum: [Archived]}
    Milestone:
      type: object
      required: [id, streamId, threshold, achievementId]
      properties:
        id: {type: string, format: uuid}
        streamId: {type: string, format: uuid}
        threshold: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        achievementId: {type: string, format: uuid}
    MilestoneCreate:
      type: object
      required: [threshold, achievementId]
      properties:
        threshold: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        achievementId: {type: string, format: uuid}
    Challenge:
      type: object
      required: [id, campaignId, streamId, startsAt, endsAt]
      properties:
        id: {type: string, format: uuid}
        campaignId: {type: string, format: uuid}
        streamId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time, description: 'Интервал [start, end)'}
        finalizedAtUtc: {type: string, format: date-time, nullable: true}
    ChallengeCreate:
      type: object
      required: [streamId, startsAt, endsAt]
      properties:
        streamId: {type: string, format: uuid}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
    BudgetBalance:
      type: object
      required: [resourceId, resourceCode, allocatedTotal, spentTotal, returnedTotal, available]
      properties:
        resourceId: {type: string, format: uuid}
        resourceCode: {type: string}
        allocatedTotal: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        spentTotal: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        returnedTotal: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        available: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
    ExternalNumber:
      type: string
      pattern: '^[\x21-\x7E]{1,100}$'
      description: Внешний номер, регистрозависим
    BudgetAllocationCreate:
      type: object
      required: [resourceId, amount, operationNumber]
      properties:
        resourceId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        operationNumber: {$ref: '#/components/schemas/ExternalNumber'}
        reason: {type: string, maxLength: 2000}
    OperationKind:
      type: string
      enum: [BudgetAllocation, ManualAward, TaskReward, Spend, AwardReversal, SpendReversal]
    RefusalCode:
      type: string
      nullable: true
      enum: [InsufficientBudget, InsufficientFunds, InsufficientBalance, ResourceUnavailable,
             RecipientNotActive, RecipientNotInAudience, OriginalAlreadyReversed, OriginalNotPosted]
    OperationItem:
      type: object
      required: [resourceId, resourceCode, amount, direction]
      properties:
        resourceId: {type: string, format: uuid}
        resourceCode: {type: string}
        amount: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        direction:
          type: string
          enum: [credit, debit]
          description: Знак движения по кошельку сотрудника
    Operation:
      type: object
      description: Единая книга; Declined — сохранённый экономический отказ без движений
      required: [id, kind, result, initiator, sourceOperationNumber, items, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        kind: {$ref: '#/components/schemas/OperationKind'}
        result: {type: string, enum: [Posted, Declined]}
        refusalCode: {$ref: '#/components/schemas/RefusalCode'}
        initiator: {$ref: '#/components/schemas/Actor'}
        masterId: {type: integer, format: int32, nullable: true}
        campaignId: {type: string, format: uuid, nullable: true}
        purchaseSystemId: {type: string, format: uuid, nullable: true}
        originalOperationId: {type: string, format: uuid, nullable: true}
        reason: {type: string, maxLength: 2000, nullable: true}
        sourceOperationNumber: {$ref: '#/components/schemas/ExternalNumber'}
        items:
          type: array
          items: {$ref: '#/components/schemas/OperationItem'}
        createdAtUtc: {type: string, format: date-time}
    SpendCreate:
      type: object
      required: [purchaseSystemId, resourceId, amount, operationNumber]
      properties:
        masterId:
          type: integer
          format: int32
          nullable: true
          description: Только для инициатора-системы покупок; сотруднику запрещено указывать чужой
        purchaseSystemId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        operationNumber: {$ref: '#/components/schemas/ExternalNumber'}
    ManualAwardCreate:
      type: object
      required: [masterId, resourceId, amount, reason, operationNumber]
      properties:
        masterId: {type: integer, format: int32, minimum: 1}
        resourceId: {type: string, format: uuid}
        amount: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
        reason: {type: string, minLength: 1, maxLength: 2000}
        operationNumber: {$ref: '#/components/schemas/ExternalNumber'}
    ReversalCreate:
      type: object
      required: [originalOperationId, reason, operationNumber]
      properties:
        originalOperationId: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 2000}
        operationNumber: {$ref: '#/components/schemas/ExternalNumber'}
    ProgressEventCreate:
      type: object
      required: [eventNumber, masterId, taskId, delta]
      properties:
        eventNumber: {$ref: '#/components/schemas/ExternalNumber'}
        masterId: {type: integer, format: int32, minimum: 1}
        taskId: {type: string, format: uuid}
        delta: {type: integer, format: int64, minimum: 1, maximum: 1000000000}
    RewardDecision:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [Granted, NotProvided, DeclinedInsufficientBudget, DeclinedResourceUnavailable]
        operationId: {type: string, format: uuid, nullable: true}
    CompletionInfo:
      type: object
      required: [taskId, periodStart, streamPointsAdded, reward, completedAtUtc]
      properties:
        taskId: {type: string, format: uuid}
        periodStart: {type: string, format: date-time}
        streamPointsAdded: {type: integer, format: int64, minimum: 0}
        reward: {$ref: '#/components/schemas/RewardDecision'}
        completedAtUtc: {type: string, format: date-time}
    ProgressEventResult:
      type: object
      required: [id, eventNumber, result, transmittedDelta, creditedDelta, acceptedAtUtc, replay]
      properties:
        id: {type: string, format: uuid}
        eventNumber: {$ref: '#/components/schemas/ExternalNumber'}
        result: {type: string, enum: [Accepted, Rejected]}
        rejectReason:
          type: string
          nullable: true
          enum: [EmployeeNotActive, AudienceMismatch, CampaignClosed, TargetArchived]
        transmittedDelta: {type: integer, format: int64, minimum: 1}
        creditedDelta: {type: integer, format: int64, minimum: 0}
        acceptedAtUtc: {type: string, format: date-time}
        replay: {type: boolean, description: true для повтора уже обработанного номера}
        completion: {$ref: '#/components/schemas/CompletionInfo', nullable: true}
    WalletBalance:
      type: object
      required: [resourceId, resourceCode, balance, resourceStatus]
      properties:
        resourceId: {type: string, format: uuid}
        resourceCode: {type: string}
        balance: {type: integer, format: int64, minimum: 0, maximum: 1000000000000000}
        resourceStatus: {type: string, enum: [Active, Archived]}
    Wallet:
      type: object
      required: [masterId, balances, generatedAtUtc]
      properties:
        masterId: {type: integer, format: int32}
        balances:
          type: array
          items: {$ref: '#/components/schemas/WalletBalance'}
        generatedAtUtc: {type: string, format: date-time}
    AchievementGrant:
      type: object
      required: [achievementId, code, name, season, grantedAtUtc]
      properties:
        achievementId: {type: string, format: uuid}
        code: {type: string}
        name: {type: string}
        season: {type: integer, format: int32}
        grantedAtUtc: {type: string, format: date-time}
    TaskProgress:
      type: object
      required: [taskId, code, current, goal, completed, periodStart]
      properties:
        taskId: {type: string, format: uuid}
        code: {type: string}
        current: {type: integer, format: int64, minimum: 0}
        goal: {type: integer, format: int64, minimum: 1}
        completed: {type: boolean}
        periodStart: {type: string, format: date-time}
        periodEnd: {type: string, format: date-time, description: 'Граница исключается'}
    StreamProgress:
      type: object
      required: [streamId, code, points, tasks, milestones]
      properties:
        streamId: {type: string, format: uuid}
        code: {type: string}
        points: {type: integer, format: int64, minimum: 0}
        tasks:
          type: array
          items: {$ref: '#/components/schemas/TaskProgress'}
        milestones:
          type: array
          items:
            type: object
            required: [threshold, achievementId, earned]
            properties:
              threshold: {type: integer, format: int64}
              achievementId: {type: string, format: uuid}
              earned: {type: boolean}
    CampaignProgress:
      type: object
      required: [campaignId, season, streams]
      properties:
        campaignId: {type: string, format: uuid}
        season: {type: integer, format: int32}
        streams:
          type: array
          items: {$ref: '#/components/schemas/StreamProgress'}
    LeaderboardEntry:
      type: object
      required: [masterId, score, place]
      properties:
        masterId: {type: integer, format: int32}
        score: {type: integer, format: int64, minimum: 0}
        place: {type: integer, format: int32, minimum: 1}
    LeaderboardPage:
      type: object
      required: [items, state, asOfUtc]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LeaderboardEntry'}
        state: {type: string, enum: [Live, Final]}
        asOfUtc: {type: string, format: date-time}
    LeaderboardMe:
      type: object
      required: [masterId, score, place, state, asOfUtc]
      properties:
        masterId: {type: integer, format: int32}
        score: {type: integer, format: int64, minimum: 0}
        place: {type: integer, format: int32, minimum: 1}
        state: {type: string, enum: [Live, Final]}
        asOfUtc: {type: string, format: date-time}
    IntegrationGrant:
      type: object
      required: [id, subject, kind, status, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        subject: {type: string}
        kind: {type: string, enum: [Progress, Award, Spend]}
        campaignId: {type: string, format: uuid, nullable: true}
        resourceId: {type: string, format: uuid, nullable: true}
        purchaseSystemId: {type: string, format: uuid, nullable: true}
        status: {type: string, enum: [Active, Revoked]}
        createdAtUtc: {type: string, format: date-time}
        revokedAtUtc: {type: string, format: date-time, nullable: true}
    IntegrationGrantCreate:
      type: object
      required: [subject, kind]
      properties:
        subject: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, enum: [Progress, Award, Spend]}
        campaignId: {type: string, format: uuid}
        resourceId: {type: string, format: uuid}
        purchaseSystemId: {type: string, format: uuid}
    PurchaseSystem:
      type: object
      required: [id, code, name, status, acceptedResourceIds]
      properties:
        id: {type: string, format: uuid}
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Active, Archived]}
        acceptedResourceIds:
          type: array
          items: {type: string, format: uuid}
    PurchaseSystemCreate:
      type: object
      required: [code, name]
      properties:
        code: {type: string, pattern: '^[A-Za-z0-9_-]{1,40}$'}
        name: {type: string, minLength: 1, maxLength: 200}
        acceptedResourceIds:
          type: array
          items: {type: string, format: uuid}
    PurchaseSystemPatch:
      type: object
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        status: {type: string, enum: [Active, Archived]}
        acceptedResourceIds:
          type: array
          items: {type: string, format: uuid}
    ExportCreate:
      type: object
      required: [scope, fromUtc, toUtc]
      properties:
        scope: {type: string, enum: [Own, Employee, Company]}
        masterId:
          type: integer
          format: int32
          nullable: true
          description: Обязателен при scope=Employee (Admin)
        resourceId:
          type: string
          format: uuid
          nullable: true
          description: null — все ресурсы
        fromUtc: {type: string, format: date-time}
        toUtc: {type: string, format: date-time, description: 'Диапазон [from, to)'}
    Export:
      type: object
      required: [id, scope, fromUtc, toUtc, status, createdAtUtc]
      properties:
        id: {type: string, format: uuid}
        scope: {type: string, enum: [Own, Employee, Company]}
        masterId: {type: integer, format: int32, nullable: true}
        resourceCode: {type: string, nullable: true}
        fromUtc: {type: string, format: date-time}
        toUtc: {type: string, format: date-time}
        status: {type: string, enum: [Pending, Forming, Ready, Error, Deleted]}
        createdAtUtc: {type: string, format: date-time}
        dataFrozenAtUtc: {type: string, format: date-time, nullable: true}
        readyAtUtc: {type: string, format: date-time, nullable: true}
        sizeBytes: {type: integer, format: int64, nullable: true}
        checksum: {type: string, nullable: true}
        errorDetail: {type: string, nullable: true}
    DownloadLink:
      type: object
      required: [id, url, expiresAtUtc]
      properties:
        id: {type: string, format: uuid}
        url: {type: string, description: Приватный S3, срок ≤ 60 с}
        expiresAtUtc: {type: string, format: date-time}
    AuditRecord:
      type: object
      required: [id, actor, action, entityType, entityId, atUtc]
      properties:
        id: {type: string, format: uuid}
        actor: {$ref: '#/components/schemas/Actor'}
        action: {type: string}
        entityType: {type: string}
        entityId: {type: string}
        changes:
          type: array
          items:
            type: object
            required: [field]
            properties:
              field: {type: string}
              from: {type: string, nullable: true}
              to: {type: string, nullable: true}
        atUtc: {type: string, format: date-time}
