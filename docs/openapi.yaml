                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/ProgressEventResult'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

