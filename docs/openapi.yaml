  /progress-events:
    post:
      tags: [Progress]
      summary: Передать событие прогресса (интеграция с действующим grant Progress)
      description: |
        Порядок обработки: (1) проверенная идентичность и компания; (2) действующий grant
        Progress на кампанию задания и обязательная активность получателя — для нового
        обращения и replay до номера; неверный токен — 401, отказ прав/активности — 403
        без любых эффектов и без записи события/занятого номера (H0 Q08, B16); (3) номер события (уникален company + проверенный
        subject + eventNumber, бессрочно, кампания в ключ не входит): новый — обработка
        (Accepted или Rejected; сохранённый бизнес-отказ занимает номер — B16.2; H0 Q08:
        ошибки валидации/прав и временный технический сбой без committed согласованного
        результата номер не занимают, потеря ответа после commit его не освобождает); тот же
        номер + те же существенные данные
        (masterId, taskId, переданная дельта; порядок JSON не важен) — исходный HTTP-статус
        и исходное сохранённое представление (completion остаётся null, если завершения
        не было на момент обработки); тот же номер с иными данными — 409. (4) Бизнес-предусловия —
        только для нового события; для найденного период/аудитория/архив/сроки/награда заново
        не вычисляются (B16.4). creditedDelta может быть 0 (B15.3). acceptedAt назначается
        по протоколу этапа 2 (время после захвата замков челленджей).
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProgressEventCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Обработано или возвращён сохранённый результат повтора
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProgressEventResult'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '503': {$ref: '#/components/responses/ServiceUnavailable'}
    get:
      tags: [Progress]
      summary: История событий компании (Admin); представление самодостаточно при completion=null
      parameters:
        - $ref: '#/components/parameters/limit'
