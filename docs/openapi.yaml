openapi: 3.0.3
info:
  title: Motiva API
  version: 1.2.0
  description: |
    Мотивационные кампании Motiva, этап 2 (контракт, реализация отсутствует). EXTERNALLY_NORMALIZED; происхождение и H0 — docs/stage-2.md.
    Соглашения:
    - Экономический отказ корректно сформированной операции — 201 с result=Declined (то же
      представление, что Posted); ошибки доступа/валидации — 4xx без создания ресурса операции.
    - Порядок обработки любого повтора: текущая авторизация проверяется первой (401/403 —
      без эффектов, ошибка доступа не создаёт бизнес-операцию и не превращается в сохранённый
      успех); далее номер: тот же номер + те же существенные данные — исходный статус и
      представление; иные существенные данные — 409. H0 Q08: ошибки валидации/прав и временный
      технический сбой без committed согласованного результата номер не занимают; сохранённый
      бизнес-отказ занимает номер; потеря ответа после commit его не освобождает.
    - Бизнес-номера (progress events, операции B24) бессрочны и не требуют Idempotency-Key;
      остальные создающие POST требуют Idempotency-Key (scope: company + инициатор + операция/цель + ключ).
    - H0 Q06/Q07: целочисленные поля отклоняют дроби без округления; masterId — число
      1..2147483647, сравнение/сортировка числовые, ведущие нули не создают другую личность.
    - Все операции изменения настроек (PATCH/PUT/DELETE) требуют If-Match; ETag доступен
      через GET объекта (strong). Экономические операции и удаление выписки If-Match не используют.
    - Все списки: items + nextCursor, limit 1..100 (default 50); исключение — live-рейтинг:
      top N и отдельное собственное место, без cursor-обхода всей коллекции. Кешируемые
      неперсональные каталоги несут обязательный asOfUtc (допуск 30 с; live-рейтинг 5 с).
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный стенд
security:
  - bearerAuth: []
tags:
  - {name: Employees}
  - {name: Resources}
  - {name: Achievements}
  - {name: Campaigns}
  - {name: Budgets}
  - {name: IntegrationGrants}
  - {name: PurchaseSystems}
  - {name: Progress}
  - {name: Wallets}
  - {name: Operations}
  - {name: Economic}
  - {name: Leaderboards}
  - {name: Audit}
  - {name: Exports}

paths:
  /employees:
    get:
      tags: [Employees]
      summary: Список сотрудников компании (Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Устойчивый порядок по masterId по возрастанию
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Employee'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      tags: [Employees]
      summary: Создать профиль сотрудника с кошельком (Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeeCreate'}
      responses:
        '201':
          description: Создан профиль и ровно один кошелёк одной транзакцией
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /employees/{masterId}:
    parameters:
      - $ref: '#/components/parameters/masterId'
    get:
      tags: [Employees]
      summary: Профиль (Admin или сам сотрудник)
      responses:
        '200':
          description: Профиль с strong ETag
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Employees]
      summary: Изменить активность/теги (Admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EmployeePatch'}
      responses:
        '200':
          description: Обновлённый профиль
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Employee'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /resources:
    get:
      tags: [Resources]
      summary: Каталог ресурсов компании (кешируемый, asOfUtc обязателен)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: status
          in: query
          schema: {type: string, enum: [Active, Archived]}
      responses:
        '200':
          description: 'Порядок по коду; now − asOfUtc ≤ 30 с'
          content:
            application/json:
              schema:
                type: object
                required: [items, asOfUtc]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Resource'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
                  asOfUtc: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Resources]
      summary: Создать ресурс (Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourceCreate'}
      responses:
        '201':
          description: Создан; балансы равны нулю; код неизменяем
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /resources/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Resources]
      summary: Ресурс
      responses:
        '200':
          description: С strong ETag
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Resources]
      summary: Переименовать или архивировать (Admin); архив необратим
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResourcePatch'}
      responses:
        '200':
          description: Обновлённый ресурс
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Resource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /achievements:
    get:
      tags: [Achievements]
      summary: Определения достижений (кешируемый, asOfUtc обязателен)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 'Порядок по коду; now − asOfUtc ≤ 30 с'
          content:
            application/json:
              schema:
                type: object
                required: [items, asOfUtc]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Achievement'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
                  asOfUtc: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Achievements]
      summary: Создать определение достижения (Admin); архивирование не предусмотрено источником
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AchievementCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создано
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Achievement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /achievements/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Achievements]
      summary: Достижение
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Achievement'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Achievements]
      summary: Изменить название/описание (Admin); код неизменяем
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AchievementPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Achievement'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /campaigns:
    get:
      tags: [Campaigns]
      summary: Кампании (сотрудник — опубликованные текущего сезона; владелец/Admin — расширенно)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
        - name: season
          in: query
          schema: {type: integer, format: int32}
        - name: status
          in: query
          schema: {type: string, enum: [Draft, Published, Archived]}
      responses:
        '200':
          description: 'Порядок по коду; now − asOfUtc ≤ 30 с'
          content:
            application/json:
              schema:
                type: object
                required: [items, asOfUtc]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Campaign'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
                  asOfUtc: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Campaigns]
      summary: Создать черновик кампании (Admin назначает владельца)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Черновик виден только владельцу и Admin
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /campaigns/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Кампания
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Campaigns]
      summary: Настроить кампанию или перевести в Published/Archived (владелец/Admin)
      description: |
        Владелец своей кампании и Admin изменяют name/description/audience и статус.
        Смена владельца — отдельное полномочие Admin: PUT /campaigns/{id}/owner.
        После публикации неизменяемы сезон, сроки, состав заданий/ресурсов, цели,
        периодичность, награды, очки, правила рейтинга — 409.
        status=Published запускает проверку состава (B09.4); провал — 409 conflict.publish-check.
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлено
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
    delete:
      tags: [Campaigns]
      summary: 'Удалить черновик кампании (владелец/Admin); не-черновик — 409'
      description: 'Настройки (стримы, задания, вехи, челленджи, теги, набор ресурсов) удаляются; проведённые операции (в т.ч. выделения бюджета), номера и аудит сохраняются со ссылкой на надгробие кампании — финансовая история не каскадится.'
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      responses:
        '204': {description: Удалено с дочерними настройками}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /campaigns/{id}/owner:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    put:
      tags: [Campaigns]
      summary: Назначить/сменить владельца кампании (только Admin)
      description: |
        Назначение владельца — полномочие администратора (B03.5); владелец не может
        переназначить владельца через PATCH кампании. Смена действует для новых обращений
        сразу после сохранения (B05.1). Кандидат — действующий сотрудник компании.
        ETag-договор: применимый strong ETag берётся из GET /campaigns/{id}; сервер сравнивает
        его с версией агрегата кампании (campaigns.version), проверка и инкремент версии
        атомарны под блокировкой строки кампании; новый ETag возвращается в ответе.
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignOwnerPut'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Владелец назначен
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Campaign'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}
  /campaigns/{id}/resources:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Набор ресурсов кампании (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: Порядок по коду ресурса
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CampaignResource'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Campaigns]
      summary: Задать набор ресурсов кампании (владелец/Admin; только черновик)
      description: |
        Владелец выбирает ресурсы своей кампании штатным API (B08). Разрешён только
        Draft-статус — после публикации набор неизменяем (B09.5); каждый ресурс — активный
        ресурс той же компании; награды заданий при сохранении должны ссылаться на ресурсы из набора.
        ETag-договор: как у PUT /campaigns/{id}/owner — strong ETag из GET /campaigns/{id}
        (версия агрегата кампании), атомарная проверка If-Match и инкремент, новый ETag в ответе.
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CampaignResourcesPut'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Набор установлен (полная замена списка)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/CampaignResource'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '428': {$ref: '#/components/responses/PreconditionRequired'}

  /campaigns/{id}/streams:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Стримы кампании (аудитория опубликованной кампании, владелец, Admin)
      parameters:
        - $ref: '#/components/parameters/limit'
        - $ref: '#/components/parameters/cursor'
      responses:
        '200':
          description: 'Порядок по коду; now − asOfUtc ≤ 30 с'
          content:
            application/json:
              schema:
                type: object
                required: [items, asOfUtc]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/Stream'}
                  nextCursor: {$ref: '#/components/schemas/Cursor'}
                  asOfUtc: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      tags: [Campaigns]
      summary: Создать стрим (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/idempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamCreate'}
      responses:
        '201':
          headers:
            Location: {schema: {type: string}}
          description: Создан
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /streams/{id}:
    parameters:
      - $ref: '#/components/parameters/uuidId'
    get:
      tags: [Campaigns]
      summary: Стрим
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: С strong ETag
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Campaigns]
      summary: Переименовать или архивировать (владелец/Admin)
      parameters:
        - $ref: '#/components/parameters/ifMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/StreamPatch'}
      responses:
        '200':
          headers:
            ETag: {schema: {type: string}}
          description: Обновлён
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Stream'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
