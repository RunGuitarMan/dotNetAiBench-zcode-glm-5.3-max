server {
    listen 80;

    # Runtime resolution through the Docker embedded DNS: replicas may be recreated
    # with new addresses at any time (T06).
    resolver 127.0.0.11 valid=5s ipv6=off;

    location / {
        set $motiva_backend "http://api:8080";
        proxy_pass $motiva_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
    }
}
